<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Política de seguridad: solo se ejecuta el código de la propia app (nada de scripts externos,
     inline ni eval). Las conexiones van por HTTPS (catálogos, nube, cuentas, IA) y, para modelos
     de IA locales, a localhost. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https: http:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiora</title>
<meta name="description" content="Tu música, sin suscripciones: biblioteca propia, nube personal, música libre y radios.">
<meta name="theme-color" content="#15131c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <nav id="nav" aria-label="Principal">
    <a class="brand" href="#/inicio"><img src="icons/icon-64.png" alt="" width="28" height="28"><span>Fiora</span></a>
    <div id="nav-links"></div>
  </nav>
  <main id="view" tabindex="-1"></main>
  <footer id="mini" hidden></footer>
</div>

<section id="now" hidden aria-label="Reproduciendo ahora"></section>
<dialog id="sheet"></dialog>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="drop" hidden><div>Suelta aquí tu música</div></div>

<input type="file" id="pick-files" multiple accept="audio/*,.mp3,.m4a,.aac,.flac,.ogg,.opus,.wav" hidden>
<input type="file" id="pick-folder" webkitdirectory multiple hidden>

<script src="vendor/jsmediatags.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
