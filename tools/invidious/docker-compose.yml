# Invidious + invidious-companion + Caddy, para que Fiora descargue de YouTube.
# Instrucciones en README.md (esta carpeta). Antes de arrancar, cambia las dos claves CAMBIA_*.
services:
  invidious:
    image: quay.io/invidious/invidious:latest
    # En Raspberry Pi y otros equipos ARM64: quay.io/invidious/invidious:latest-arm64
    restart: unless-stopped
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: kemal
          host: invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
          - private_url: "http://companion:8282/companion"
        invidious_companion_key: "CAMBIA_16_CARACT"
        hmac_key: "CAMBIA_ESTA_CLAVE_POR_UNA_LARGA_Y_ALEATORIA"
        registration_enabled: false
        statistics_enabled: false
    depends_on:
      - invidious-db

  companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped
    environment:
      # La misma que invidious_companion_key (exactamente 16 caracteres)
      - SERVER_SECRET_KEY=CAMBIA_16_CARACT
    volumes:
      - companioncache:/var/tmp/youtubei.js:rw
    cap_drop:
      - ALL
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true

  invidious-db:
    image: docker.io/library/postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: kemal
    volumes:
      - postgresdata:/var/lib/postgresql/data

  # Una sola puerta (puerto 8080) para Invidious y el audio de companion, y permiso para que Fiora
  # (otra web) pueda leer las respuestas (CORS).
  caddy:
    image: docker.io/library/caddy:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - invidious
      - companion

volumes:
  postgresdata:
  companioncache:
